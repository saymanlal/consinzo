id: ring-buffer-history
slug: ring-buffer-history
title: "Fixed-Capacity Ring Buffer"
description: "Implement a circular buffer that keeps only the last N values pushed, where N is fixed at construction, and reads them back in chronological order with constant-cost writes."
ecosystem: ethereum-evm
language: Solidity
difficulty: easy
category: programming-fundamentals
tags:
  - solidity
  - data-structures
  - ring-buffer
  - modulo-arithmetic
  - storage
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/RingBuffer.sol
  editable_files:
    - src/RingBuffer.sol
  readonly_files:
    - test/RingBuffer.t.sol
tests:
  public_suite: evaluation/public/RingBuffer.t.sol
  hidden_suite: evaluation/hidden/RingBufferHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 150000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Write position"
    content: "Count every push. The slot for the next value is totalPushed % capacity, so once the buffer is full the oldest slot is the one that gets overwritten."
  - order: 2
    title: "Where the oldest value lives"
    content: "The stored values are pushes number totalPushed - length up to totalPushed - 1. The logical index i therefore maps to slot (totalPushed - length + i) % capacity."
  - order: 3
    title: "Length saturates"
    content: "length is totalPushed until the buffer fills up and capacity afterwards."
solution_unlock_policy: after_pass
