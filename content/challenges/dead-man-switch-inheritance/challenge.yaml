id: dead-man-switch-inheritance
slug: dead-man-switch-inheritance
title: "Dead-Man Switch Inheritance Wallet"
description: "Build an ETH wallet whose owner must send periodic heartbeats. If the owner stays silent for a full period, a named heir can take over ownership of the wallet."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: smart-contract-engineering
tags:
  - inheritance
  - heartbeat
  - access-control
  - timestamps
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/DeadManSwitch.sol
  editable_files:
    - src/DeadManSwitch.sol
  readonly_files:
    - test/DeadManSwitch.t.sol
tests:
  public_suite: evaluation/public/DeadManSwitch.t.sol
  hidden_suite: evaluation/hidden/DeadManSwitchHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 150000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "One timestamp is enough"
    content: "Store only lastHeartbeat. The moment the heir may act is lastHeartbeat + silencePeriod, and every owner action pushes it forward by writing block.timestamp again."
  - order: 2
    title: "What claim must reset"
    content: "After a successful claim the old owner must have no power left and the new owner must not be immediately claimable by anyone: update owner, clear heir and restart the timer."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Solidity Units and Globally Available Variables"
    url: https://docs.soliditylang.org/en/v0.8.28/units-and-global-variables.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Solidity Common Patterns: Restricting Access"
    url: https://docs.soliditylang.org/en/v0.8.28/common-patterns.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
