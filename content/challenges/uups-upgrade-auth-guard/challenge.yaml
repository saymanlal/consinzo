id: uups-upgrade-auth-guard
slug: uups-upgrade-auth-guard
title: "Exploit Unprotected Upgradeable Implementation"
description: "Red-team mission: exploit a proxy-style vault whose upgradeTo function lacks access control by swapping its implementation and draining funds."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: security-engineering
tags:
  - exploit
  - upgradeability
  - proxy
  - red-team
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/UpgradeExploit.sol
  editable_files:
    - src/UpgradeExploit.sol
  readonly_files:
    - test/UpgradeExploit.t.sol
tests:
  public_suite: evaluation/public/UpgradeExploit.t.sol
  hidden_suite: evaluation/hidden/UpgradeExploitHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 300000
  weights:
    functional_correctness: 50
    security_invariants: 35
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Root cause analysis
    content: "Inspect authorization, accounting, and state-ordering assumptions in UpgradeExploit.sol."
solution_unlock_policy: after_pass
documentation_references:
  - title: "UUPS Upgrade Authorization Security"
    url: https://docs.openzeppelin.com/contracts/5.x/api/proxy#UUPSUpgradeable
    source: OpenZeppelin Docs
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-security
reviewer: consinzo-core
publication_status: published
is_security_mission: true
