id: automation-task-scheduler
slug: automation-task-scheduler
title: "Automation-Compatible Task Scheduler"
description: "Build a recurring-task registry that exposes the keeper interface checkUpkeep / performUpkeep, selecting due tasks in bounded batches and re-validating every id at execution time."
ecosystem: ethereum-evm
language: Solidity
difficulty: normal
category: ecosystem-integrations
tags:
  - automation
  - keepers
  - scheduling
  - upkeep
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/TaskScheduler.sol
  editable_files:
    - src/TaskScheduler.sol
  readonly_files:
    - test/TaskScheduler.t.sol
tests:
  public_suite: evaluation/public/TaskScheduler.t.sol
  hidden_suite: evaluation/hidden/TaskSchedulerHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 400000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "One predicate for both functions"
    content: "Write isDue once and use it in checkUpkeep and again in performUpkeep. performData is only a list of candidates."
  - order: 2
    title: "Write state before calling out"
    content: "Advance nextRunAt before the low-level call. That single ordering handles duplicate ids and targets that call back into the scheduler."
  - order: 3
    title: "Stay on the grid"
    content: "Compute how many whole intervals have elapsed since nextRunAt and add one more interval, rather than adding one interval or using block.timestamp + interval."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Solidity Security Considerations"
    url: https://docs.soliditylang.org/en/v0.8.28/security-considerations.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Solidity Contract ABI Specification"
    url: https://docs.soliditylang.org/en/v0.8.28/abi-spec.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
