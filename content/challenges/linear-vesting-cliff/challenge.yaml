id: linear-vesting-cliff
slug: linear-vesting-cliff
title: "Linear Token Vesting Wallet with Cliff"
description: "Build an ETH vesting schedule supporting an initial cliff timestamp, linear unlock over duration, and beneficiary-only release."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: protocol-implementation
tags:
  - vesting
  - cliff
  - time-lock
  - treasury
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/VestingWallet.sol
  editable_files:
    - src/VestingWallet.sol
  readonly_files:
    - test/VestingWallet.t.sol
tests:
  public_suite: evaluation/public/VestingWallet.t.sol
  hidden_suite: evaluation/hidden/VestingWalletHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 300000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Implementation check
    content: "Follow the specification in README.md and check edge-case reverts."
solution_unlock_policy: after_pass
documentation_references:
  - title: "OpenZeppelin VestingWallet"
    url: https://docs.openzeppelin.com/contracts/5.x/api/finance#VestingWallet
    source: OpenZeppelin Docs
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
