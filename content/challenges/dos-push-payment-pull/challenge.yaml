id: dos-push-payment-pull
slug: dos-push-payment-pull
title: "Fix King-of-Ether Push-Payment Denial of Service"
description: "Refactor a push-payment auction contract into pull-payment withdrawals so a malicious bidder cannot permanently brick outbidding by reverting on receive()."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: security-engineering
tags:
  - patch
  - dos
  - pull-over-push
  - auction
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/PullAuction.sol
  editable_files:
    - src/PullAuction.sol
  readonly_files:
    - test/PullAuction.t.sol
tests:
  public_suite: evaluation/public/PullAuction.t.sol
  hidden_suite: evaluation/hidden/PullAuctionHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 300000
  weights:
    functional_correctness: 50
    security_invariants: 35
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Root cause analysis
    content: "Inspect authorization, accounting, and state-ordering assumptions in PullAuction.sol."
solution_unlock_policy: after_pass
documentation_references:
  - title: "SWC-113 DoS with Failed Call"
    url: https://swcregistry.io/docs/SWC-113/
    source: SWC Registry
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-security
reviewer: consinzo-core
publication_status: published
is_security_mission: true
