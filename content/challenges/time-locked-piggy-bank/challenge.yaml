id: time-locked-piggy-bank
slug: time-locked-piggy-bank
title: "Time-Locked Piggy Bank"
description: "Build a savings contract that accepts ETH deposits at any time but lets its owner withdraw only once an unlock timestamp fixed at construction has been reached."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: smart-contract-engineering
tags:
  - solidity
  - block-timestamp
  - timelock
  - payable
  - eth-transfer
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/PiggyBank.sol
  editable_files:
    - src/PiggyBank.sol
  readonly_files:
    - test/PiggyBank.t.sol
tests:
  public_suite: evaluation/public/PiggyBank.t.sol
  hidden_suite: evaluation/hidden/PiggyBankHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 120000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Fix the time at deployment"
    content: "Store the unlock timestamp in an immutable. Validate in the constructor that it lies strictly after block.timestamp."
  - order: 2
    title: "Inclusive boundary"
    content: "The bank is unlocked when block.timestamp >= unlockTime. At exactly unlockTime a withdrawal must succeed."
  - order: 3
    title: "Remaining time without underflow"
    content: "unlockTime - block.timestamp underflows once the time has passed. Return 0 in that case instead of subtracting."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Block and Transaction Properties"
    url: https://docs.soliditylang.org/en/v0.8.28/units-and-global-variables.html#block-and-transaction-properties
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Time Units"
    url: https://docs.soliditylang.org/en/v0.8.28/units-and-global-variables.html#time-units
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Receive Ether Function"
    url: https://docs.soliditylang.org/en/v0.8.28/contracts.html#receive-ether-function
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
