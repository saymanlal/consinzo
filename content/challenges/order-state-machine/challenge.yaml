id: order-state-machine
slug: order-state-machine
title: "Order Lifecycle State Machine"
description: "Model an order lifecycle with an enum: Created, Paid, Shipped, Delivered. Each step is allowed only from the previous state and only for the right party; anything else reverts."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: smart-contract-engineering
tags:
  - solidity
  - enums
  - state-machine
  - access-control
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/OrderTracker.sol
  editable_files:
    - src/OrderTracker.sol
  readonly_files:
    - test/OrderTracker.t.sol
tests:
  public_suite: evaluation/public/OrderTracker.t.sol
  hidden_suite: evaluation/hidden/OrderTrackerHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 120000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Use the enum's zero value"
    content: "The first enum member is the default for unset storage. Making it None means an order id that was never created reads as None without extra bookkeeping."
  - order: 2
    title: "One guard, three callers"
    content: "Each transition does the same three checks in the same order: the order exists, the caller is the right party, the current status is the expected one. Only then does it write the next status."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Enums"
    url: https://docs.soliditylang.org/en/v0.8.28/types.html#enums
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Common Patterns: State Machine"
    url: https://docs.soliditylang.org/en/v0.8.28/common-patterns.html#state-machine
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
