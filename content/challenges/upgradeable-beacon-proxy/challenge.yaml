id: upgradeable-beacon-proxy
slug: upgradeable-beacon-proxy
title: "Beacon Proxy with an Upgradeable Beacon Serving Many Proxies"
description: "Implement the beacon upgrade pattern: an owner-controlled beacon that stores one implementation address, and a proxy that stores only the beacon address in its EIP-1967 slot and asks the beacon for the implementation on every call. One beacon upgrade switches every proxy at once."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: advanced-blockchain-systems
tags:
  - beacon-proxy
  - eip-1967
  - upgradeability
  - delegatecall
  - solidity
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/BeaconProxy.sol
  editable_files:
    - src/BeaconProxy.sol
  readonly_files:
    - test/BeaconProxy.t.sol
tests:
  public_suite: evaluation/public/BeaconProxy.t.sol
  hidden_suite: evaluation/hidden/BeaconProxyHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 400000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Ask the beacon on every call"
    content: "The proxy must not cache the implementation address. Read the beacon slot, staticcall implementation() on the beacon, then delegatecall the result."
  - order: 2
    title: "Validate both hops"
    content: "A proxy pointing at a beacon without code, or a beacon pointing at an implementation without code, silently succeeds on every call and does nothing. Check code length at construction and on beacon upgrades."
  - order: 3
    title: "Initialise through the proxy"
    content: "The initialisation data must be delegate-called from the proxy's constructor so that it writes to the proxy's storage, and its revert data must be passed on."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-1967: Proxy Storage Slots (beacon slot)"
    url: https://eips.ethereum.org/EIPS/eip-1967
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
  - title: "Solidity: Inline Assembly"
    url: https://docs.soliditylang.org/en/v0.8.28/assembly.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
