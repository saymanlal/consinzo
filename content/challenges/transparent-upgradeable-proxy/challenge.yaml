id: transparent-upgradeable-proxy
slug: transparent-upgradeable-proxy
title: "Transparent Upgradeable Proxy with EIP-1967 Slots"
description: "Implement a transparent upgradeable proxy. The implementation and admin addresses live in the EIP-1967 storage slots, the admin can only reach the proxy's own management functions, and every other caller is always delegated to the implementation, even for selectors that clash with the management functions."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: advanced-blockchain-systems
tags:
  - proxy
  - eip-1967
  - upgradeability
  - delegatecall
  - solidity
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/TransparentProxy.sol
  editable_files:
    - src/TransparentProxy.sol
  readonly_files:
    - test/TransparentProxy.t.sol
tests:
  public_suite: evaluation/public/TransparentProxy.t.sol
  hidden_suite: evaluation/hidden/TransparentProxyHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 400000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Dispatch inside the fallback"
    content: "Declaring upgradeTo and friends as normal external functions makes them shadow the implementation for every caller. Route everything through fallback() and branch on msg.sender first, then on msg.sig for the admin."
  - order: 2
    title: "Fixed slots, no state variables"
    content: "Any ordinary state variable in the proxy occupies slot 0, 1, ... and collides with the implementation's layout. Read and write the two EIP-1967 slots with sload and sstore only."
  - order: 3
    title: "Bubble up revert data"
    content: "After a delegatecall, copy returndata and either return it or revert with it. This applies to the fallback path and to the initialisation call in the constructor and in upgradeToAndCall."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-1967: Proxy Storage Slots"
    url: https://eips.ethereum.org/EIPS/eip-1967
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
  - title: "Solidity: Inline Assembly"
    url: https://docs.soliditylang.org/en/v0.8.28/assembly.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
