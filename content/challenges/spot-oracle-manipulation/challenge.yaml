id: spot-oracle-manipulation
slug: spot-oracle-manipulation
title: "Mitigate Spot AMM Oracle Price Manipulation"
description: "Patch a collateralized borrowing protocol that relies on live manipulable AMM reserves instead of a bounded TWAP/reference oracle."
ecosystem: ethereum-evm
language: Solidity
difficulty: hard
category: security-engineering
tags:
  - patch
  - oracle-manipulation
  - defi
  - lending
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/OracleLending.sol
  editable_files:
    - src/OracleLending.sol
  readonly_files:
    - test/OracleLending.t.sol
tests:
  public_suite: evaluation/public/OracleLending.t.sol
  hidden_suite: evaluation/hidden/OracleLendingHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 200
  gas_budget: 300000
  weights:
    functional_correctness: 50
    security_invariants: 35
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Root cause analysis
    content: "Inspect authorization, accounting, and state-ordering assumptions in OracleLending.sol."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Uniswap v3 TWAP Oracle Security"
    url: https://docs.uniswap.org/concepts/protocol/oracle
    source: Uniswap Docs
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-security
reviewer: consinzo-core
publication_status: published
is_security_mission: true
