id: hashed-timelock-atomic-swap
slug: hashed-timelock-atomic-swap
title: "Hashed Timelock Contract for Atomic Swaps"
description: "Implement an HTLC for ETH and ERC-20 tokens: lock funds under a SHA-256 hashlock and a timelock, claim with the preimage before expiry, refund afterwards, and publish the preimage so the counterparty can complete the swap on the other chain."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: cross-chain-development
tags:
  - htlc
  - atomic-swap
  - cross-chain
  - timelock
  - erc20
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/HashedTimelock.sol
  editable_files:
    - src/HashedTimelock.sol
  readonly_files:
    - test/HashedTimelock.t.sol
tests:
  public_suite: evaluation/public/HashedTimelock.t.sol
  hidden_suite: evaluation/hidden/HashedTimelockHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 300000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Complementary time checks"
    content: "Claim must be valid strictly before the timelock and refund from the timelock onwards, so that the two can never both be possible in the same block."
  - order: 2
    title: "Measure what arrived"
    content: "For tokens, compare the contract's balance before and after transferFrom and store the difference as the swap amount."
  - order: 3
    title: "Low-level token calls"
    content: "Use token.call with the encoded selector and accept either empty return data or an encoded true. Update the swap state before paying out."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Solidity Units and Globally Available Variables (sha256, block.timestamp)"
    url: https://docs.soliditylang.org/en/v0.8.28/units-and-global-variables.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Solidity Security Considerations"
    url: https://docs.soliditylang.org/en/v0.8.28/security-considerations.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "EIP-20 Token Standard"
    url: https://eips.ethereum.org/EIPS/eip-20
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
