id: near-allowlist-registry
slug: near-allowlist-registry
title: "NEAR Owner-Managed Allowlist with Guarded Action"
description: "Build an allowlist that an owner manages by adding and removing accounts, and a check-in action that only currently allowlisted accounts may call."
ecosystem: near
language: TypeScript
difficulty: beginner
category: smart-contract-engineering
tags:
  - near
  - access-control
  - allowlist
  - lookup-map
toolchain:
  compiler: tsc
  version: "5.9.3"
  runner: near-ts-vm
starter:
  entry_file: src/Allowlist.ts
  editable_files:
    - src/Allowlist.ts
  readonly_files:
    - test/Allowlist.t.ts
tests:
  public_suite: evaluation/public/Allowlist.t.ts
  hidden_suite: evaluation/hidden/AllowlistHidden.t.ts
  timeout_ms: 10000
scoring:
  max_points: 100
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Two different guards"
    content: "add and remove are guarded by the owner check. checkIn is guarded by membership of the caller in the allowlist. The owner is not a member unless it is added."
  - order: 2
    title: "Membership is current state"
    content: "Removing an account must take effect immediately for checkIn, but the check-ins it already made stay recorded."
solution_unlock_policy: after_pass
documentation_references:
  - title: "NEAR Contract Environment"
    url: https://docs.near.org/smart-contracts/anatomy/environment
    source: NEAR Protocol Docs
    version: "2026"
    verified_at: "2026-11-28"
  - title: "NEAR Storage Collections"
    url: https://docs.near.org/smart-contracts/anatomy/collections
    source: NEAR Protocol Docs
    version: "2026"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
