id: vault-distributor-cross-contract-reentrancy
slug: vault-distributor-cross-contract-reentrancy
title: "Patch Cross-Contract Reentrancy Between a Vault and Its Reward Distributor"
description: "A staking vault and a reward distributor each have their own reentrancy lock, but the distributor pays rewards before it records them and the vault can trigger a second payout through a trusted hook. Patch the pair so a staker can never be paid the same reward twice, whichever contract they re-enter through."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: security-engineering
tags:
  - patch
  - reentrancy
  - cross-contract
  - staking
  - rewards
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/RewardDistributor.sol
  editable_files:
    - src/RewardDistributor.sol
  readonly_files:
    - test/RewardDistributor.t.sol
tests:
  public_suite: evaluation/public/RewardDistributor.t.sol
  hidden_suite: evaluation/hidden/RewardDistributorHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 400000
  weights:
    functional_correctness: 50
    security_invariants: 35
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "A lock protects one contract"
    content: "Each nonReentrant modifier only knows about calls into its own contract. While the distributor is paying, the vault is unlocked, and the vault is allowed to call back into the distributor."
  - order: 2
    title: "Find every payout path"
    content: "Rewards leave the distributor from claim() and from settle(). For each of them, write down the value of rewardDebt at the moment the ETH is sent."
  - order: 3
    title: "Record first, pay second"
    content: "If rewardDebt is brought up to date before the transfer, pending() returns zero for any nested call, no matter which contract it arrives through. One shared internal harvest routine keeps both paths identical."
solution_unlock_policy: after_pass
documentation_references:
  - title: "SWC-107 Reentrancy"
    url: https://swcregistry.io/docs/SWC-107/
    source: "SWC Registry"
    version: "1.0"
    verified_at: "2026-11-28"
  - title: "Security Considerations: Reentrancy"
    url: https://docs.soliditylang.org/en/v0.8.28/security-considerations.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-security
reviewer: consinzo-core
publication_status: published
is_security_mission: true
