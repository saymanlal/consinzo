id: flash-lender-eip3156
slug: flash-lender-eip3156
title: "EIP-3156 Flash Loan Provider"
description: "Build an ERC-20 flash loan lender implementing EIP-3156 callback magic-value verification and principal + fee repayment invariant checks."
ecosystem: ethereum-evm
language: Solidity
difficulty: hard
category: defi-engineering
tags:
  - eip3156
  - flash-loan
  - defi
  - callbacks
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/FlashLender.sol
  editable_files:
    - src/FlashLender.sol
  readonly_files:
    - test/FlashLender.t.sol
tests:
  public_suite: evaluation/public/FlashLender.t.sol
  hidden_suite: evaluation/hidden/FlashLenderHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 200
  gas_budget: 300000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Implementation check
    content: "Follow the specification in README.md and check edge-case reverts."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-3156 Flash Loans"
    url: https://eips.ethereum.org/EIPS/eip-3156
    source: Ethereum EIPs
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
