id: create-address-predictor
slug: create-address-predictor
title: "CREATE Address Predictor with RLP Encoding"
description: "Compute the address a contract will receive when it is deployed with the CREATE opcode by a given deployer at a given nonce. This requires RLP-encoding the (deployer, nonce) pair by hand and is checked against real deployments."
ecosystem: ethereum-evm
language: Solidity
difficulty: normal
category: blockchain-infrastructure
tags:
  - create-opcode
  - rlp
  - address-derivation
  - nonce
  - solidity
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/CreateAddressPredictor.sol
  editable_files:
    - src/CreateAddressPredictor.sol
  readonly_files:
    - test/CreateAddressPredictor.t.sol
tests:
  public_suite: evaluation/public/CreateAddressPredictor.t.sol
  hidden_suite: evaluation/hidden/CreateAddressPredictorHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 400000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Integers have no leading zeros in RLP"
    content: "The nonce is encoded as the shortest big-endian byte string. Zero is the empty string (0x80), values below 0x80 are a single byte that stands for itself, and everything else is 0x80 plus the byte length followed by the bytes."
  - order: 2
    title: "The list header depends on the nonce length"
    content: "The payload is 21 bytes for the address item plus the encoded nonce. The payload is always shorter than 56 bytes, so the list prefix is the single byte 0xc0 plus the payload length."
  - order: 3
    title: "Contracts start at nonce 1"
    content: "Since EIP-161 a newly created contract has nonce 1, so the first contract it deploys uses nonce 1, not 0."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-161: State Trie Clearing (contract nonces start at 1)"
    url: https://eips.ethereum.org/EIPS/eip-161
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
  - title: "EIP-1014: Skinny CREATE2 (contrasts with the CREATE address formula)"
    url: https://eips.ethereum.org/EIPS/eip-1014
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
  - title: "EIP-2681: Limit Account Nonce to 2^64-1"
    url: https://eips.ethereum.org/EIPS/eip-2681
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
