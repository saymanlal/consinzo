id: near-owner-config-log
slug: near-owner-config-log
title: "NEAR Owner-Only Configuration with Change Log"
description: "Build a key-value configuration store that only the owner can modify, where every effective change is appended to an on-chain change log with the old and new value."
ecosystem: near
language: TypeScript
difficulty: beginner
category: smart-contract-engineering
tags:
  - near
  - access-control
  - ownership
  - audit-log
toolchain:
  compiler: tsc
  version: "5.9.3"
  runner: near-ts-vm
starter:
  entry_file: src/OwnerConfig.ts
  editable_files:
    - src/OwnerConfig.ts
  readonly_files:
    - test/OwnerConfig.t.ts
tests:
  public_suite: evaluation/public/OwnerConfig.t.ts
  hidden_suite: evaluation/hidden/OwnerConfigHidden.t.ts
  timeout_ms: 10000
scoring:
  max_points: 100
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Capture the owner once"
    content: "Read near.predecessorAccountId() in the constructor and compare against it at the top of every state-changing method."
  - order: 2
    title: "Log only real changes"
    content: "Read the current value before writing. If it equals the new value, reject the call so the log never contains no-op entries."
solution_unlock_policy: after_pass
documentation_references:
  - title: "NEAR Smart Contract Anatomy"
    url: https://docs.near.org/smart-contracts/anatomy/anatomy
    source: NEAR Protocol Docs
    version: "2026"
    verified_at: "2026-11-28"
  - title: "NEAR Contract Environment"
    url: https://docs.near.org/smart-contracts/anatomy/environment
    source: NEAR Protocol Docs
    version: "2026"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
