id: eip712-typed-data-verifier
slug: eip712-typed-data-verifier
title: "EIP-712 Domain Separator & Typed Struct Verifier"
description: "Construct an EIP-712 domain separator and Mail struct hash verifier supporting chain-ID-aware domain separation."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: blockchain-infrastructure
tags:
  - eip712
  - hashing
  - cryptography
  - domain-separator
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/EIP712Verifier.sol
  editable_files:
    - src/EIP712Verifier.sol
  readonly_files:
    - test/EIP712Verifier.t.sol
tests:
  public_suite: evaluation/public/EIP712Verifier.t.sol
  hidden_suite: evaluation/hidden/EIP712VerifierHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 300000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Implementation check
    content: "Follow the specification in README.md and check edge-case reverts."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-712 Typed Structured Data Hashing"
    url: https://eips.ethereum.org/EIPS/eip-712
    source: Ethereum EIPs
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
