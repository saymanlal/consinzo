id: read-only-reentrancy-oracle
slug: read-only-reentrancy-oracle
title: "Protect View Price Queries Against Read-Only Reentrancy"
description: "Fix an ETH liquidity pool whose view sharePrice() reads stale ETH balance vs totalShares mid-withdrawal during an external ETH callback."
ecosystem: ethereum-evm
language: Solidity
difficulty: legend
category: security-engineering
tags:
  - patch
  - read-only-reentrancy
  - reentrancy
  - view-guard
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/PoolViewGuard.sol
  editable_files:
    - src/PoolViewGuard.sol
  readonly_files:
    - test/PoolViewGuard.t.sol
tests:
  public_suite: evaluation/public/PoolViewGuard.t.sol
  hidden_suite: evaluation/hidden/PoolViewGuardHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 200
  gas_budget: 300000
  weights:
    functional_correctness: 50
    security_invariants: 35
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Root cause analysis
    content: "Inspect authorization, accounting, and state-ordering assumptions in PoolViewGuard.sol."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Read-Only Reentrancy Pattern"
    url: https://chainsecurity.com/curve-lp-oracle-manipulation-post-mortem/
    source: ChainSecurity Research
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-security
reviewer: consinzo-core
publication_status: published
is_security_mission: true
