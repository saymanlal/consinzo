id: timelock-governance
slug: timelock-governance
title: Protocol Governance Timelock Controller
description: Build a time-delayed governance execution controller enforcing minimum queue delay, grace-period expiration, and cancellation controls.
ecosystem: ethereum-evm
language: Solidity
difficulty: advanced
category: protocol-implementation
tags:
  - governance
  - timelock
  - access-control
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/TimelockController.sol
  editable_files:
    - src/TimelockController.sol
  readonly_files:
    - test/TimelockController.t.sol
tests:
  public_suite: evaluation/public/TimelockController.t.sol
  hidden_suite: evaluation/hidden/TimelockControllerHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 200
  gas_budget: 300000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Execution window bounds
    content: Verify block.timestamp >= eta && block.timestamp <= eta + GRACE_PERIOD before clearing queued[txHash] and calling target.
solution_unlock_policy: after_pass
documentation_references:
  - title: Compound Timelock Architecture
    url: https://docs.openzeppelin.com/contracts/5.x/api/governance#TimelockController
    source: OpenZeppelin Docs
    version: "5.x"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
