id: permit-deadline-bypass
slug: permit-deadline-bypass
title: "Enforce Permit Deadline & Nonce Invariants"
description: "Patch an EIP-2612-style permit handler that forgets to check deadline expiry and increment per-owner nonces."
ecosystem: ethereum-evm
language: Solidity
difficulty: easy
category: security-engineering
tags:
  - patch
  - eip2612
  - permit
  - deadline
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/PermitVault.sol
  editable_files:
    - src/PermitVault.sol
  readonly_files:
    - test/PermitVault.t.sol
tests:
  public_suite: evaluation/public/PermitVault.t.sol
  hidden_suite: evaluation/hidden/PermitVaultHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 300000
  weights:
    functional_correctness: 50
    security_invariants: 35
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Root cause analysis
    content: "Inspect authorization, accounting, and state-ordering assumptions in PermitVault.sol."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-2612 Permit Extension"
    url: https://eips.ethereum.org/EIPS/eip-2612
    source: Ethereum EIPs
    version: "1.0"
    verified_at: "2026-11-26"
version: "1.0.0"
maintainer: consinzo-security
reviewer: consinzo-core
publication_status: published
is_security_mission: true
