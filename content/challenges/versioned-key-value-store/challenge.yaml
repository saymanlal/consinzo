id: versioned-key-value-store
slug: versioned-key-value-store
title: "Versioned Key-Value Store with Conditional Writes"
description: "Implement a key-value store in which every key carries a monotonically increasing version. A write or removal only succeeds when the caller supplies the version it expects, which gives clients optimistic concurrency control."
ecosystem: ethereum-evm
language: Solidity
difficulty: easy
category: blockchain-infrastructure
tags:
  - storage
  - optimistic-concurrency
  - versioning
  - solidity
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/VersionedStore.sol
  editable_files:
    - src/VersionedStore.sol
  readonly_files:
    - test/VersionedStore.t.sol
tests:
  public_suite: evaluation/public/VersionedStore.t.sol
  hidden_suite: evaluation/hidden/VersionedStoreHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 250000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Removal is also a write"
    content: "Deleting a key must increase its version. If removal reset the version to zero, a stale writer that still expects version 0 could overwrite the key as if it had never existed."
  - order: 2
    title: "Keep existence separate from the value"
    content: "An empty bytes value is a legal value. Track whether the key is live with its own flag instead of checking the value length."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Solidity: Errors and the Revert Statement"
    url: https://docs.soliditylang.org/en/v0.8.28/contracts.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Solidity: Mapping Types"
    url: https://docs.soliditylang.org/en/v0.8.28/types.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
