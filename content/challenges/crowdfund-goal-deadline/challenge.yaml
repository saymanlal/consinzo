id: crowdfund-goal-deadline
slug: crowdfund-goal-deadline
title: "Crowdfunding Campaign with Goal and Deadline"
description: "Build an all-or-nothing ETH crowdfunding campaign: backers contribute until a deadline, the creator claims the pot if the goal was met, and backers refund themselves if it was not."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: smart-contract-engineering
tags:
  - crowdfunding
  - ether-handling
  - deadlines
  - pull-payments
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/Crowdfund.sol
  editable_files:
    - src/Crowdfund.sol
  readonly_files:
    - test/Crowdfund.t.sol
tests:
  public_suite: evaluation/public/Crowdfund.t.sol
  hidden_suite: evaluation/hidden/CrowdfundHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 200000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Two outcomes, one deadline"
    content: "Nothing can be paid out before the deadline. After it, exactly one of claim or refund is possible, decided by comparing totalRaised with goal."
  - order: 2
    title: "Zero before you send"
    content: "In refund, set the caller's recorded contribution to zero before transferring ETH, so a second call (or a re-entrant one) finds nothing to refund."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Solidity Common Patterns: Withdrawal from Contracts"
    url: https://docs.soliditylang.org/en/v0.8.28/common-patterns.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Solidity Units and Globally Available Variables"
    url: https://docs.soliditylang.org/en/v0.8.28/units-and-global-variables.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
