id: immutable-constant-config
slug: immutable-constant-config
title: "Immutable and Constant Fee Configuration"
description: "Build a fee configuration contract whose limits are compile-time constants and whose settings are validated once in the constructor and stored as immutables, then expose views derived from them."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: programming-fundamentals
tags:
  - solidity
  - immutable
  - constant
  - constructor
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/FeeConfig.sol
  editable_files:
    - src/FeeConfig.sol
  readonly_files:
    - test/FeeConfig.t.sol
tests:
  public_suite: evaluation/public/FeeConfig.t.sol
  hidden_suite: evaluation/hidden/FeeConfigHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 60000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Validate before you assign"
    content: "Check both constructor arguments first and revert with the matching custom error. An immutable can only be assigned during construction, so there is no second chance to fix a bad value."
  - order: 2
    title: "Multiply before you divide"
    content: "feeFor must compute amount * feeBps / BPS_DENOMINATOR in that order. Dividing first throws away the precision that small amounts need."
  - order: 3
    title: "Derive the net amount from the fee"
    content: "netAmount is amount minus feeFor(amount). Computing it with a second division can make fee plus net differ from amount by one wei."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Constant and Immutable State Variables"
    url: https://docs.soliditylang.org/en/v0.8.28/contracts.html#constant-and-immutable-state-variables
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Errors and the Revert Statement"
    url: https://docs.soliditylang.org/en/v0.8.28/contracts.html#errors-and-the-revert-statement
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
