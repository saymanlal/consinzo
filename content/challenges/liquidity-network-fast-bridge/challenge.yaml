id: liquidity-network-fast-bridge
slug: liquidity-network-fast-bridge
title: "Liquidity-Network Bridge Pool"
description: "Build the destination pool of a liquidity-network bridge: LPs front transfers for a fee and are reimbursed when the canonical bridge settles, with share pricing, fee splitting and exactly-once handling of the fast and slow paths."
ecosystem: ethereum-evm
language: Solidity
difficulty: hard
category: cross-chain-development
tags:
  - bridge
  - liquidity-pool
  - share-accounting
  - fees
  - settlement
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/FastBridgePool.sol
  editable_files:
    - src/FastBridgePool.sol
  readonly_files:
    - test/FastBridgePool.t.sol
tests:
  public_suite: evaluation/public/FastBridgePool.t.sol
  hidden_suite: evaluation/hidden/FastBridgePoolHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 200
  gas_budget: 400000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Count, do not measure"
    content: "Keep idle, outstanding and protocolFees as storage counters and derive every decision from them. The token balance is only ever a consequence."
  - order: 2
    title: "When is the fee earned"
    content: "Fronting a transfer swaps cash for a receivable of the same value. The share price should move only when the reimbursement arrives."
  - order: 3
    title: "One id, two legs, either order"
    content: "Track a state per transfer id. Think through fulfil-then-settle, settle-then-fulfil, and each leg repeated."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-20 Token Standard"
    url: https://eips.ethereum.org/EIPS/eip-20
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
  - title: "Solidity Security Considerations"
    url: https://docs.soliditylang.org/en/v0.8.28/security-considerations.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
