id: two-step-ownership-transfer
slug: two-step-ownership-transfer
title: "Two-Step Ownership Transfer"
description: "Implement ownership that changes hands in two steps: the owner proposes a successor, who must accept from their own account. The owner can cancel a pending proposal."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: smart-contract-engineering
tags:
  - solidity
  - ownership
  - access-control
  - modifiers
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/TwoStepOwnable.sol
  editable_files:
    - src/TwoStepOwnable.sol
  readonly_files:
    - test/TwoStepOwnable.t.sol
tests:
  public_suite: evaluation/public/TwoStepOwnable.t.sol
  hidden_suite: evaluation/hidden/TwoStepOwnableHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 90000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Two storage slots"
    content: "Keep owner and pendingOwner separately. Proposing writes only pendingOwner; the owner does not change until the candidate accepts."
  - order: 2
    title: "Accept is called by the candidate"
    content: "acceptOwnership checks msg.sender against pendingOwner, not against owner."
  - order: 3
    title: "Clear the pending slot"
    content: "After acceptance or cancellation pendingOwner must be address(0). Otherwise a stale candidate could take ownership later."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Function Modifiers"
    url: https://docs.soliditylang.org/en/v0.8.28/contracts.html#function-modifiers
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "EIP-173: Contract Ownership Standard"
    url: https://eips.ethereum.org/EIPS/eip-173
    source: Ethereum EIPs
    version: "Final"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
