id: cross-chain-governance-receiver
slug: cross-chain-governance-receiver
title: "Cross-Chain Governance Receiver"
description: "Implement the receiving side of cross-chain governance: authenticate proposals relayed from a trusted remote governor, queue them behind a timelock by action hash, execute them atomically inside a grace period and let a guardian cancel them."
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: cross-chain-development
tags:
  - governance
  - timelock
  - cross-chain-messaging
  - access-control
  - reentrancy
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/GovernanceReceiver.sol
  editable_files:
    - src/GovernanceReceiver.sol
  readonly_files:
    - test/GovernanceReceiver.t.sol
tests:
  public_suite: evaluation/public/GovernanceReceiver.t.sol
  hidden_suite: evaluation/hidden/GovernanceReceiverHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 500000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Two-layer origin check"
    content: "First make sure the caller is the messenger. Only then are the chain id and sender arguments meaningful, and both of them must match."
  - order: 2
    title: "Status before calls"
    content: "Write the Executed status before the loop of external calls. A revert on failure undoes it automatically."
  - order: 3
    title: "Expired is computed"
    content: "Store only Queued, Executed and Cancelled. Derive Expired from eta and the current time in state()."
solution_unlock_policy: after_pass
documentation_references:
  - title: "ERC-5164: Cross-Chain Execution"
    url: https://eips.ethereum.org/EIPS/eip-5164
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
  - title: "Solidity Security Considerations"
    url: https://docs.soliditylang.org/en/v0.8.28/security-considerations.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Solidity ABI Specification"
    url: https://docs.soliditylang.org/en/v0.8.28/abi-spec.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
