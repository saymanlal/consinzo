id: owner-gated-storage-box
slug: owner-gated-storage-box
title: "Owner-Gated Storage Box"
description: "Build a contract that stores one number. Anyone can read it, but only the deployer may change it, and unauthorized writes revert with a custom error."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: programming-fundamentals
tags:
  - solidity
  - access-control
  - custom-errors
  - state-variables
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/StorageBox.sol
  editable_files:
    - src/StorageBox.sol
  readonly_files:
    - test/StorageBox.t.sol
tests:
  public_suite: evaluation/public/StorageBox.t.sol
  hidden_suite: evaluation/hidden/StorageBoxHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 80000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Record the deployer"
    content: "Inside the constructor msg.sender is the account that deployed the contract. Store it once; an immutable variable is the cheapest place for a value that never changes."
  - order: 2
    title: "Check before you write"
    content: "Compare msg.sender with the stored owner at the top of set and revert with NotOwner(msg.sender) before touching any state."
  - order: 3
    title: "Read the old value first"
    content: "The event needs both the previous and the new value, so copy the previous value into a local variable before overwriting storage."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Errors and the Revert Statement"
    url: https://docs.soliditylang.org/en/v0.8.28/contracts.html#errors-and-the-revert-statement
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Common Patterns: Restricting Access"
    url: https://docs.soliditylang.org/en/v0.8.28/common-patterns.html#restricting-access
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
