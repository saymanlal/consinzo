id: payout-loop-off-by-one
slug: payout-loop-off-by-one
title: "Fix an Off-by-One in a Payout Loop"
description: "BatchPayout pays a list of payees in one transaction, but its loop bound stops one element early, so the last payee is never paid and their entry is then erased. Patch the loop so every payee is paid exactly once."
ecosystem: ethereum-evm
language: Solidity
difficulty: easy
category: security-engineering
tags:
  - patch
  - off-by-one
  - loops
  - payments
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/BatchPayout.sol
  editable_files:
    - src/BatchPayout.sol
  readonly_files:
    - test/BatchPayout.t.sol
tests:
  public_suite: evaluation/public/BatchPayout.t.sol
  hidden_suite: evaluation/hidden/BatchPayoutHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 300000
  weights:
    functional_correctness: 50
    security_invariants: 35
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Count the iterations"
    content: "For an array of length n the valid indexes are 0 to n - 1. Work out which indexes the starter loop visits when n is 1 and when n is 3."
  - order: 2
    title: "What happens after the loop"
    content: "The list and totalOwed are cleared once the loop ends. A payee the loop skipped has no record left to claim against."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Control Structures"
    url: https://docs.soliditylang.org/en/v0.8.28/control-structures.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Types: Arrays"
    url: https://docs.soliditylang.org/en/v0.8.28/types.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-security
reviewer: consinzo-core
publication_status: published
is_security_mission: true
