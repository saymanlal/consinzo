id: otc-swap-escrow
slug: otc-swap-escrow
title: "OTC Swap Escrow with Partial Fills"
description: "Implement a peer-to-peer swap escrow: a maker deposits token A and names a fixed price in token B, takers fill the order fully or partially at that price with rounding in the maker's favour, and the maker can cancel the unfilled remainder."
ecosystem: ethereum-evm
language: Solidity
difficulty: normal
category: defi-engineering
tags:
  - otc
  - escrow
  - partial-fills
  - erc20
  - rounding
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/OtcEscrow.sol
  editable_files:
    - src/OtcEscrow.sol
  readonly_files:
    - test/OtcEscrow.t.sol
tests:
  public_suite: evaluation/public/OtcEscrow.t.sol
  hidden_suite: evaluation/hidden/OtcEscrowHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 300000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Price from the original amounts"
    content: "Always quote against the order's original sellAmount and buyAmount, not against what remains. Otherwise the price drifts as the order is filled."
  - order: 2
    title: "Round up what the taker pays"
    content: "cost = ceil(take * buyAmount / sellAmount) = (take * buyAmount + sellAmount - 1) / sellAmount. Rounding down would let a taker split a fill into dust and underpay."
  - order: 3
    title: "Closing an order"
    content: "An order stops being active when its remaining amount reaches zero or when the maker cancels. Both fill and cancel must reject inactive orders, which also covers ids that were never created."
solution_unlock_policy: after_pass
documentation_references:
  - title: "EIP-20 Token Standard"
    url: https://eips.ethereum.org/EIPS/eip-20
    source: "Ethereum EIPs"
    version: "Final"
    verified_at: "2026-11-28"
  - title: "Solidity Security Considerations"
    url: https://docs.soliditylang.org/en/v0.8.28/security-considerations.html
    source: "Solidity Documentation"
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
