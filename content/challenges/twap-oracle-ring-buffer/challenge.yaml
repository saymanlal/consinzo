id: twap-oracle-ring-buffer
slug: twap-oracle-ring-buffer
title: TWAP Oracle with a Ring Buffer of Observations
description: Build a time-weighted average price oracle that stores cumulative-price observations in a fixed-size ring buffer and answers consult(secondsAgo) by interpolating between stored observations.
ecosystem: ethereum-evm
language: Solidity
difficulty: intermediate
category: defi-engineering
tags:
  - oracle
  - twap
  - ring-buffer
  - cumulative-price
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/TwapOracle.sol
  editable_files:
    - src/TwapOracle.sol
  readonly_files:
    - test/TwapOracle.t.sol
tests:
  public_suite: evaluation/public/TwapOracle.t.sol
  hidden_suite: evaluation/hidden/TwapOracleHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 150
  gas_budget: 400000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: Store the integral, not the price
    content: Each observation stores the running sum of price multiplied by seconds. The average over any window is the difference of two cumulative values divided by the window length.
  - order: 2
    title: Three cases for the window start
    content: The start of the window is either at or after the newest observation (extrapolate with the current price), before the oldest observation (revert), or between two stored observations (interpolate linearly between their cumulative values).
  - order: 3
    title: Walking the ring
    content: The oldest live observation sits at (index + 1) % cardinality once the buffer is full, and at slot 0 before that. Iterate logical positions and map them to physical slots with a modulo.
solution_unlock_policy: after_pass
