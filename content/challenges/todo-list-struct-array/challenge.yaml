id: todo-list-struct-array
slug: todo-list-struct-array
title: "Todo List With a Struct Array"
description: "Build a per-user todo list backed by a dynamic array of structs: add items, toggle their done flag, read them by index and count them."
ecosystem: ethereum-evm
language: Solidity
difficulty: beginner
category: programming-fundamentals
tags:
  - solidity
  - structs
  - arrays
  - storage
toolchain:
  compiler: solc
  version: "0.8.28"
  runner: evm-foundry-solc
  evm_version: paris
starter:
  entry_file: src/TodoList.sol
  editable_files:
    - src/TodoList.sol
  readonly_files:
    - test/TodoList.t.sol
tests:
  public_suite: evaluation/public/TodoList.t.sol
  hidden_suite: evaluation/hidden/TodoListHidden.t.sol
  timeout_ms: 15000
scoring:
  max_points: 100
  gas_budget: 150000
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "A list per user"
    content: "A mapping from address to a dynamic array of structs gives every account its own list: mapping(address => Todo[])."
  - order: 2
    title: "Bounds first"
    content: "Array access past the end panics. Compare the index with the array length yourself and revert with IndexOutOfBounds(index, length) before indexing."
  - order: 3
    title: "Edit in place"
    content: "Take a storage reference (Todo storage item = list[index]) to flip the flag. A memory copy would be changed and then thrown away."
solution_unlock_policy: after_pass
documentation_references:
  - title: "Structs"
    url: https://docs.soliditylang.org/en/v0.8.28/types.html#structs
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Arrays"
    url: https://docs.soliditylang.org/en/v0.8.28/types.html#arrays
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
  - title: "Data Location and Assignment Behavior"
    url: https://docs.soliditylang.org/en/v0.8.28/types.html#data-location-and-assignment-behavior
    source: Solidity Documentation
    version: "0.8.28"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
