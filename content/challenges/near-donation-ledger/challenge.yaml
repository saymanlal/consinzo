id: near-donation-ledger
slug: near-donation-ledger
title: "NEAR Donation Ledger with Top Donor"
description: "Record attached-deposit donations per account, expose per-donor and global totals, count unique donors and track the top donor as donations arrive."
ecosystem: near
language: TypeScript
difficulty: beginner
category: smart-contract-engineering
tags:
  - near
  - attached-deposit
  - accounting
  - lookup-map
toolchain:
  compiler: tsc
  version: "5.9.3"
  runner: near-ts-vm
starter:
  entry_file: src/DonationLedger.ts
  editable_files:
    - src/DonationLedger.ts
  readonly_files:
    - test/DonationLedger.t.ts
tests:
  public_suite: evaluation/public/DonationLedger.t.ts
  hidden_suite: evaluation/hidden/DonationLedgerHidden.t.ts
  timeout_ms: 10000
scoring:
  max_points: 100
  weights:
    functional_correctness: 60
    security_invariants: 25
    efficiency: 10
    code_quality: 5
hints:
  - order: 1
    title: "Read the deposit from the runtime"
    content: "The donated amount is near.attachedDeposit(), a bigint in yoctoNEAR. Reject calls where it is 0n."
  - order: 2
    title: "Track the leader incrementally"
    content: "You cannot iterate a LookupMap to find the maximum. After each donation compare the donor's new total with the stored top total and replace the leader only when it is strictly greater."
solution_unlock_policy: after_pass
documentation_references:
  - title: "NEAR Contract Environment"
    url: https://docs.near.org/smart-contracts/anatomy/environment
    source: NEAR Protocol Docs
    version: "2026"
    verified_at: "2026-11-28"
  - title: "NEAR Storage Collections"
    url: https://docs.near.org/smart-contracts/anatomy/collections
    source: NEAR Protocol Docs
    version: "2026"
    verified_at: "2026-11-28"
version: "1.0.0"
maintainer: consinzo-core
reviewer: consinzo-security
publication_status: published
is_security_mission: false
