name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @consinzo/scoring test
      - run: pnpm --filter @consinzo/validators test
      - run: pnpm --filter @consinzo/runner-evm test
      - run: pnpm --filter @consinzo/runner-near test
      - run: pnpm --filter @consinzo/web typecheck
      - run: pnpm --filter @consinzo/web test
      - run: pnpm validate:challenges
      - run: pnpm --filter @consinzo/web build
