name: Challenge Validation

on:
  push:
    paths:
      - "content/challenges/**"
      - "packages/challenge-spec/**"
      - "packages/validators/**"
      - "runners/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-challenges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm validate:challenges
